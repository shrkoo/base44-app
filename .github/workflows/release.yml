name: Build Homa AI Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/homa-release.jks"

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/homa-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Build signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/homa-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: homa-ai-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: homa-ai-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Delete temporary keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/homa-release.jks"
