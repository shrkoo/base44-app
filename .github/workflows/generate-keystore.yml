name: Generate Homa AI Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore homa-release.jks \
            -alias homa \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Homa AI, OU=Homa AI, O=Homa AI, L=Unknown, ST=Unknown, C=US"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: homa-release-keystore
          path: homa-release.jks
          retention-days: 1
