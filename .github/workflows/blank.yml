name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download Android TWA project
        run: |
          git clone --depth 1 https://github.com/GoogleChromeLabs/bubblewrap.git bubblewrap-source
          test -d bubblewrap-source

      - name: Download Nexsa manifest
        run: |
          curl -fL https://portable-smart-ally-ai.base44.app/manifest.json -o manifest.json
          test -s manifest.json
          cat manifest.json

      - name: Prepare Android project
        run: |
          mkdir -p nexsa-android
          cp manifest.json nexsa-android/

      - name: Check project
        run: |
          echo "Package: ai.nexsa.app"
          echo "Nexsa Android project prepared successfully."

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: Nexsa-AI-Android-Project
          path: nexsa-android/
