name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download Nexsa manifest
        run: |
          curl -fL https://portable-smart-ally-ai.base44.app/manifest.json -o manifest.json
          test -s manifest.json

      - name: Verify environment
        run: |
          java -version
          node --version
          npm --version
          echo "Nexsa manifest downloaded successfully."
