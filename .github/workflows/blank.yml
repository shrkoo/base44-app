name: Build Nexsa AI Android v18

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXSA_STORE_PASSWORD: ${{ secrets.NEXSA_STORE_PASSWORD }}
      NEXSA_KEY_PASSWORD: ${{ secrets.NEXSA_KEY_PASSWORD }}
      NEXSA_KEYSTORE_BASE64: ${{ secrets.NEXSA_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip

          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check signing secrets
        shell: bash
        run: |
          set -e

          if [ -z "$NEXSA_STORE_PASSWORD" ]; then
            echo "ERROR: NEXSA_STORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$NEXSA_KEY_PASSWORD" ]; then
            echo "ERROR: NEXSA_KEY_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$NEXSA_KEYSTORE_BASE64" ]; then
            echo "ERROR: NEXSA_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "All Nexsa signing secrets are available."

      - name: Restore permanent signing key
        shell: bash
        run: |
          set -e

          mkdir -p nexsa-build

          printf '%s' "$NEXSA_KEYSTORE_BASE64" \
            | base64 --decode > nexsa-build/nexsa-release.jks

          if [ ! -s nexsa-build/nexsa-release.jks ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Permanent Nexsa keystore restored."

      - name: Verify permanent signing key
        shell: bash
        working-directory: nexsa-build
        run: |
          set -e

          keytool -list \
            -keystore nexsa-release.jks \
            -storepass "$NEXSA_STORE_PASSWORD" \
            -alias nexsa

          echo "Permanent signing key verified."

      - name: Create Nexsa Android project
        shell: bash
        run: |
          set -e

          mkdir -p nexsa-build/app/src/main/java/ai/nexsa/app
          mkdir -p nexsa-build/app/src/main/res/values

          cat > nexsa-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NexsaAI"
          include(":app")
          EOF

          cat > nexsa-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > nexsa-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > nexsa-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ai.nexsa.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'ai.nexsa.app'
                  minSdk 23
                  targetSdk 35

                  versionCode 18
                  versionName '1.0.18'
              }

              signingConfigs {
                  release {
                      storeFile file("../nexsa-release.jks")
                      storePassword System.getenv("NEXSA_STORE_PASSWORD")
                      keyAlias "nexsa"
                      keyPassword System.getenv("NEXSA_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.activity:activity:1.9.3'
          }
          EOF

          cat > nexsa-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Nexsa AI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Nexsa">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > nexsa-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.Nexsa"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#14B8A6</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > nexsa-build/app/src/main/java/ai/nexsa/app/MainActivity.java <<'EOF'
          package ai.nexsa.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://portable-smart-ally-ai.base44.app"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Validate Gradle configuration
        working-directory: nexsa-build
        shell: bash
        run: |
          set -e

          gradle \
            :app:tasks \
            --no-daemon

          echo "Gradle configuration is valid."

      - name: Build signed APK
        working-directory: nexsa-build
        shell: bash
        run: |
          set -e

          gradle \
            assembleRelease \
            --no-daemon

      - name: Build signed AAB
        working-directory: nexsa-build
        shell: bash
        run: |
          set -e

          gradle \
            bundleRelease \
            --no-daemon

      - name: Locate apksigner
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner was not found at:"
            echo "$APKSIGNER"

            echo "Searching Android SDK..."

            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              -print

            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "apksigner found successfully."

      - name: Verify APK signature
        working-directory: nexsa-build
        shell: bash
        run: |
          set -e

          "$APKSIGNER" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

          echo "APK signature verification successful."

      - name: Verify AAB signature
        working-directory: nexsa-build
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            app/build/outputs/bundle/release/app-release.aab

          echo "AAB signature verification successful."

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          rm -rf outputs
          mkdir -p outputs

          cp \
            nexsa-build/app/build/outputs/apk/release/app-release.apk \
            outputs/Nexsa-AI-v18.apk

          cp \
            nexsa-build/app/build/outputs/bundle/release/app-release.aab \
            outputs/Nexsa-AI-v18.aab

          echo "Release files:"
          ls -lh outputs/

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nexsa-AI-v18-release
          path: outputs/
          if-no-files-found: error
