name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Android project
        run: |
          mkdir nexsa
          cd nexsa
          yes "" | bubblewrap init \
            --manifest https://portable-smart-ally-ai.base44.app/manifest.json

      - name: Build AAB
        working-directory: nexsa
        run: |
          yes "" | bubblewrap build

      - name: Find Android files
        run: |
          find . -type f \( -name "*.aab" -o -name "*.apk" \)

      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexsa-AI-Android
          path: |
            **/*.aab
            **/*.apk
