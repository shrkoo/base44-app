name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare Bubblewrap environment
        run: |
          export JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm config set fund false
          npm config set audit false

      - name: Initialize Android project
        run: |
          mkdir -p nexsa-android
          cd nexsa-android
          npx --yes @bubblewrap/cli init \
            --manifest https://portable-smart-ally-ai.base44.app/manifest.json \
            --directory .

      - name: Build Android
        run: |
          cd nexsa-android
          npx --yes @bubblewrap/cli build

      - name: Find Android files
        run: |
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: Nexsa-AI-Android
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
