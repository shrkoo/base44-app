name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Android project
        run: |
          bubblewrap init \
            --manifest https://portable-smart-ally-ai.base44.app/manifest.json

      - name: Build APK and AAB
        run: |
          bubblewrap build

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: nexsa-ai-android
          path: |
            *.apk
            *.aab
            **/app-release.apk
            **/app-release.aab
