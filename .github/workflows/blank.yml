name: Build Nexsa AI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Check Java
        run: java -version

      - name: Check Node
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Check Bubblewrap
        run: bubblewrap --version

      - name: Show Bubblewrap help
        run: bubblewrap --help
