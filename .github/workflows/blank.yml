name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version

      - name: Prepare manifest
        run: |
          mkdir -p nexsa
          curl -fL https://portable-smart-ally-ai.base44.app/manifest.json -o nexsa/manifest.json

      - name: Generate TWA
        working-directory: nexsa
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          bubblewrap init \
            --manifest ./manifest.json \
            --directory . \
            --packageId ai.nexsa.app

      - name: Build AAB
        working-directory: nexsa
        run: |
          bubblewrap build

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nexsa-AI-AAB
          path: nexsa/**/*.aab
          if-no-files-found: error
