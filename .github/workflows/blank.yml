name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download TWA template
        run: |
          git clone https://github.com/GoogleChromeLabs/bubblewrap.git bubblewrap-source
          find bubblewrap-source -maxdepth 4 -type d -name "template_project" -print

      - name: Check manifest
        run: |
          curl -fL https://portable-smart-ally-ai.base44.app/manifest.json -o manifest.json
          cat manifest.json

      - name: Stop before build
        run: echo "Environment and manifest check completed successfully."
