name: Build Nexsa AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PWA manifest
        run: |
          curl -fL https://portable-smart-ally-ai.base44.app/manifest.json -o manifest.json
          cat manifest.json

      - name: Check manifest
        run: |
          python3 - <<'PY'
          import json

          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)

          print("App name:", manifest.get("name"))
          print("Start URL:", manifest.get("start_url"))
          print("Display:", manifest.get("display"))
          print("Icons:", len(manifest.get("icons", [])))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Show Bubblewrap version
        run: bubblewrap --version
