name: Build Nexsa AI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare Bubblewrap
        run: |
          mkdir -p nexsa
          curl -fL https://portable-smart-ally-ai.base44.app/manifest.json -o nexsa/manifest.json

      - name: Generate TWA project
        working-directory: nexsa
        run: |
          bubblewrap init \
            --manifest ./manifest.json \
            --directory . \
            --packageId ai.nexsa.app \
            --appName "Nexsa AI" \
            --launcherName "Nexsa AI" \
            --displayMode standalone \
            --startUrl "https://portable-smart-ally-ai.base44.app"

      - name: Build AAB
        working-directory: nexsa
        run: |
          bubblewrap build --skipPwaValidation

      - name: Find AAB
        run: |
          find nexsa -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nexsa-AI-AAB
          path: nexsa/**/*.aab
          if-no-files-found: error
